<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разлом — браузерная RTS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="topbar">
    <div class="res" title="Золото">💰 <span id="resGold">0</span></div>
    <div class="res" title="Дерево">🪵 <span id="resWood">0</span></div>
    <div class="res" id="supplyWrap" title="Лимит снабжения">🧍 <span id="resSupply">0/0</span></div>
    <div class="spacer"></div>
    <div id="gameTime">0:00</div>
    <button id="btnPause" title="Пауза (Пробел)">⏸</button>
    <button id="btnHelp" title="Управление">?</button>
    <button id="btnRestart" title="Начать заново">⟳</button>
  </div>

  <div id="toasts"></div>

  <div id="bottombar">
    <div id="minimapWrap" title="Миникарта: ЛКМ — камера"><canvas id="minimap" width="168" height="168"></canvas></div>
    <div id="selPanel"></div>
    <div id="cmdCard"></div>
  </div>

  <div id="overlay" style="display:none"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
